[pytest]
# Host and agent suites use hyphenated file names (test-*.py) so that the
# wrappers can run them directly with any Python; this pattern lets plain
# `pytest` discover the same files without renaming them.
python_files = test-*.py test_*.py
# Same-basename suites in scripts/claude and scripts/codex and the hosts
# package both rely on importlib collection rather than rootdir sys.path
# insertion.
addopts = --import-mode=importlib
