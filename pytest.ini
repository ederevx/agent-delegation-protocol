[pytest]
# Host and agent suites use hyphenated file names (test-*.py) so that the
# wrappers can run them directly with any Python; this pattern lets plain
# `pytest` discover the same files without renaming them.
python_files = test-*.py test_*.py
# importlib collection inserts nothing on sys.path and never confuses the
# same-basename test-protocol.py harnesses (which conftest.py excludes from
# collection anyway); the hosts package needs the conftest's sys.path insert
# under this mode.
addopts = --import-mode=importlib
